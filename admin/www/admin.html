<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Router admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--wash:rgba(11,11,11,.04);--accent:#2a78d6;--on-accent:#fff;--good:#1d8a4e;--bad:#c93a3a;--warn:#b86e00}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--border:rgba(255,255,255,.12);--wash:rgba(255,255,255,.05);--accent:#3987e5;--good:#3fb871;--bad:#ef6a6a;--warn:#e0a03a}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 20px}
header{padding-top:28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;font-weight:600;margin:0}
h2{font-size:16px;font-weight:600;margin:0 0 12px}
.sub{color:var(--text2);margin:2px 0 0;font-size:14px}
.acts{display:flex;gap:14px;align-items:center;font-size:14px;white-space:nowrap}
a{color:var(--accent)}
nav{display:flex;gap:4px;margin:20px 0 18px;box-shadow:inset 0 -1px var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 12px;text-decoration:none;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
@media (max-width:600px){nav{gap:0}nav a{padding:8px 9px}.wide{display:none}}
nav a[aria-current]{color:var(--text);border-color:var(--accent);font-weight:500}
main{padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid .card{margin:0}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:14px;margin-bottom:14px;align-items:stretch}
.pair .card{margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:14px}
dt{color:var(--text2)}dd{margin:0;overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.dot.on{background:var(--good)}.dot.off{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--text2);padding:6px 8px;border-bottom:1px solid var(--border)}
th button.sort{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
th button.sort[aria-pressed=true]{color:var(--text)}
td.cmd{max-width:420px;overflow-wrap:anywhere}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.muted{color:var(--muted)}.hint{color:var(--text2);font-size:13px;margin:4px 0 0}
.card>.hint+.row{margin-top:14px}
.row{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;align-items:start;margin-bottom:12px}
.row>label,.row>.lbl{padding-top:7px;color:var(--text2);font-size:14px}
@media (max-width:600px){.row{grid-template-columns:1fr}.row>label,.row>.lbl{padding-top:0}}
input[type=text],input[type=password],select{font:inherit;color:inherit;background:var(--page);border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:100%;max-width:340px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[aria-invalid=true]{border-color:var(--bad)}
.check{display:flex;gap:8px;align-items:center;padding-top:6px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
button:hover{background:var(--wash)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:3px 9px;font-size:13px}
button.link{border:0;background:none;color:var(--accent);padding:0;font-size:14px}
button:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.ok{color:var(--good)}
pre.log{margin:0;max-height:480px;overflow:auto;white-space:pre-wrap;word-break:break-word}
progress{width:100%;max-width:340px}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:22px 24px;max-width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog p{margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--page);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sr,input.sr{position:absolute;width:1px;height:1px;padding:0;border:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Router admin</h1><p class="sub" id="who">&nbsp;</p></div>
    <div class="acts"><a href="/">Home</a><button class="link" id="logout" hidden>Log out</button></div>
  </div>
  <nav id="tabs" aria-label="Sections" hidden>
    <a href="#status">Status</a><a href="#wifi">Wi-Fi</a><a href="#network">Network</a><a href="#system">System</a><a href="#maintenance">Backup<span class="wide"> &amp; firmware</span></a>
  </nav>
</header>
<main id="view"></main>
<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2>Log in</h2>
    <p class="hint" id="loginWhy">Use the router's root password.</p>
    <input type="text" name="username" value="root" autocomplete="username" class="sr" tabindex="-1" aria-hidden="true">
    <div class="row" style="grid-template-columns:1fr;margin-top:12px"><label for="pw" class="sr">Password</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required></div>
    <p class="err" id="loginErr" hidden></p>
    <div class="btns"><button class="primary" id="loginBtn">Log in</button><button type="button" id="loginCancel">Cancel</button></div>
  </form>
</dialog>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const ZERO = "0".repeat(32), HELPER = "/usr/libexec/admin-apply", ROLLBACK_SECS = 60;
const $ = id => document.getElementById(id);
let sid = sessionStorage.getItem("admin-sid") || "", rid = 0, loginWait = null, timers = [];

/* ---------- small helpers ---------- */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k == "class") e.className = v;
    else if (k == "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
const pair = (...cards) => el("div", {class: "pair"}, cards);
const card = (title, ...kids) => el("section", {class: "card"}, title && el("h2", {text: title}), ...kids);
const kv = pairs => el("dl", null, pairs.filter(p => p && p[1] != null && p[1] !== "").map(([k, v]) => [el("dt", {text: k}), el("dd", null, v)]));
const state = (on, word) => el("span", null, el("span", {class: "dot " + (on ? "on" : "off")}), word);
let fid = 0;
function field(label, control, hint) {
  if (!control.id) control.id = "f" + ++fid;
  return el("div", {class: "row"}, el("label", {for: control.id, text: label}), el("div", null, control, hint && el("p", {class: "hint"}, hint)));
}
function select(options, value) {       // options: [[value, label], ...]
  const s = el("select");
  if (value != null && !options.some(o => o[0] === value)) options = [[value, value], ...options];
  for (const [v, l] of options) s.append(el("option", {value: v, selected: v === value, text: l}));
  return s;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3500);
}
function errBox(e) { return el("p", {class: "err", text: e && e.message || String(e)}); }
async function busy(btn, fn) {
  const was = btn.textContent; btn.disabled = true;
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = was; }
}
function every(ms, fn) {
  const h = setInterval(() => { if (!document.hidden) fn().catch(() => {}); }, ms);
  timers.push(h);
}
// Scroll a box to its end; on first load the view isn't on screen yet, so wait until it is.
function toBottom(e, tries = 120) {
  if (e.isConnected && e.clientHeight) e.scrollTop = e.scrollHeight;
  else if (tries) requestAnimationFrame(() => toBottom(e, tries - 1));
}
const fmtUp = s => { const d = s / 86400 | 0, h = s % 86400 / 3600 | 0, m = s % 3600 / 60 | 0; return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; };
const fmtMB = b => (b / 1048576).toLocaleString(undefined, {maximumFractionDigits: 1}) + " MB";
const isIPv4 = s => /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(s);
const ip2n = s => s.split(".").reduce((a, o) => a * 256 + +o, 0);
const isMask = s => { if (!isIPv4(s)) return false; const n = ip2n(s), inv = 2 ** 32 - 1 - n; return n > 0 && (inv & (inv + 1)) === 0; };

/* ---------- ubus over HTTP ---------- */
const STATUS = ["ok", "invalid command", "invalid argument", "method not found", "not found", "no data",
  "permission denied", "timed out", "not supported", "unknown error", "connection failed"];
async function call(obj, method, args = {}, retry = true) {
  let j;
  try {
    const r = await fetch("/ubus", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({jsonrpc: "2.0", id: ++rid, method: "call", params: [sid || ZERO, obj, method, args]})});
    j = await r.json();
  } catch (e) { throw new Error("Can't reach the router."); }
  if (j.error) {
    if (j.error.code == -32002 && retry) { await relogin(); return call(obj, method, args, false); }
    throw new Error(j.error.message || "Request failed");
  }
  if (j.result[0]) throw new Error(`${obj} ${method}: ${STATUS[j.result[0]] || "error " + j.result[0]}`);
  return j.result[1] || {};
}
const exec = (command, params = []) => call("file", "exec", {command, params: params.map(String)});
async function helper(...p) {
  const r = await exec(HELPER, p);
  if (r.code) throw Object.assign(new Error((r.stdout || r.stderr || "failed").trim()), {code: r.code});
  return (r.stdout || "").trim();
}

/* ---------- login ---------- */
function relogin(why) {
  if (!loginWait) loginWait = new Promise(res => {
    const d = $("login");
    $("loginWhy").textContent = why || (sid ? "Your session has expired. Log in again to continue." : "Use the router's root password.");
    $("loginErr").hidden = true; $("pw").value = "";
    // Without a session this page has nothing to show: Cancel (or Esc) goes back to the router's home page.
    const leave = () => { location.href = "/"; };
    d.oncancel = e => { e.preventDefault(); leave(); };
    $("loginCancel").onclick = leave;
    $("loginForm").onsubmit = async e => {
      e.preventDefault();
      const b = $("loginBtn");
      await busy(b, async () => {
        try {
          const r = await rawLogin($("pw").value);
          if (!r) { $("loginErr").textContent = "Wrong password."; $("loginErr").hidden = false; return; }
          sid = r; sessionStorage.setItem("admin-sid", sid);
          d.close(); loginWait = null; res();
        } catch (err) { $("loginErr").textContent = err.message; $("loginErr").hidden = false; }
      });
    };
    d.showModal(); $("pw").focus();
  });
  return loginWait;
}
async function rawLogin(password) {   // session id, or null for a wrong password
  let j;
  try {
    j = await (await fetch("/ubus", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({jsonrpc: "2.0", id: ++rid, method: "call",
        params: [ZERO, "session", "login", {username: "root", password, timeout: 1800}]})})).json();
  } catch (e) { throw new Error("Can't reach the router."); }
  return j.result && j.result[0] === 0 ? j.result[1].ubus_rpc_session : null;
}

/* ---------- dialogs ---------- */
function ask(title, body, buttons) {    // buttons: [[value, label, class]], resolves with value
  const d = $("dlg");
  return new Promise(res => {
    d.replaceChildren(el("h2", {text: title}), ...[body].flat().map(b => typeof b == "string" ? el("p", {text: b}) : b),
      el("div", {class: "btns"}, buttons.map(([v, l, c]) => el("button", {class: c, text: l, onclick: () => { d.close(); res(v); }}))));
    d.oncancel = () => res(null);
    d.showModal();
  });
}
const confirmAct = (title, body, label, cls = "primary") => ask(title, body, [[true, label, cls], [false, "Cancel"]]);

// A settings change is live but not yet kept: offer Keep / Undo, undone by the router after the countdown.
async function pendingDialog(newHost) {
  const d = $("dlg"), left = el("strong"), msg = el("p"), keep = el("button", {class: "primary", text: "Keep changes"}),
    undo = el("button", {text: "Undo now"}), err = el("p", {class: "err", hidden: true});
  let secs = ROLLBACK_SECS, done = false, polling = false;
  const body = newHost
    ? [el("p", null, "The router is moving to ", el("strong", {text: newHost}), ". Open the new address within ", left,
        " seconds to keep the change, otherwise the old settings come back."),
      el("p", null, el("a", {href: `http://${newHost}/admin.html#keep=${sid}`, text: `Open http://${newHost}/admin.html`}))]
    : [el("p", null, "The new settings are active. If everything still works, keep them. Otherwise they're undone automatically in ", left, " seconds."), msg];
  d.replaceChildren(el("h2", {text: "Keep the new settings?"}), ...body, err, el("div", {class: "btns"}, newHost ? [] : [keep, undo]));
  d.oncancel = e => e.preventDefault();
  d.showModal();
  return new Promise(res => {
    const finish = text => { done = true; clearInterval(h); d.close(); toast(text); res(); route(); };
    const tick = async () => {
      left.textContent = Math.max(0, secs--);
      if (done || polling || secs % 2) return;   // with newHost, success here means the old address came back
      polling = true;
      try {
        const s = await helper("status");
        msg.textContent = "";
        if (s == "idle") finish("The change wasn't kept in time, so the previous settings were restored.");
        else secs = Math.min(secs, +s.split(" ")[1]);
      } catch (e) {
        msg.textContent = "Waiting for the router… (reconnect to its Wi-Fi if you changed the network name or password)";
      }
      polling = false;
    };
    const h = setInterval(tick, 1000); tick();
    keep.onclick = () => busy(keep, async () => {
      try { await helper("confirm"); finish("Changes kept."); }
      catch (e) { err.hidden = false; err.textContent = e.code == 3 ? "Too late: the previous settings were already restored." : e.message; }
    });
    undo.onclick = () => busy(undo, async () => {
      try { await helper("rollback"); } catch (e) { /* already undone */ }
      finish("Changes undone.");
    });
  });
}

// Apply uci operations through the helper. rollback: wait for "Keep" (network-affecting changes).
async function applyOps(ops, rollback, newHost) {
  if (!ops.length) { toast("Nothing changed."); return false; }
  try { await helper("apply", rollback ? ROLLBACK_SECS : 0, ...ops); }
  catch (e) {
    if (e.code == 2) { await pendingDialog(); throw new Error("An earlier change was still waiting; try again."); }
    throw e;
  }
  if (rollback) await pendingDialog(newHost); else toast("Saved.");
  return true;
}
// Collect set/delete operations for changed values only.
function differ(cfg) {
  const ops = [];
  const set = (sec, opt, val, cur) => {
    cur = cur == null ? "" : Array.isArray(cur) ? cur.join(" ") : String(cur);
    if (val === cur) return;
    if (val === "") ops.push("delete", `${cfg}.${sec}.${opt}`);
    else ops.push("set", `${cfg}.${sec}.${opt}=${val}`);
  };
  return {ops, set};
}

// Wait for the router to go away and come back (reboot, firmware), then reload.
async function waitForRouter(title, text, expectSecs) {
  const d = $("dlg"), st = el("p", {class: "muted", text: "Waiting for the router to go down…"});
  d.replaceChildren(el("h2", {text: title}), el("p", {text}), st);
  d.oncancel = e => e.preventDefault(); d.showModal();
  const t0 = Date.now(), ping = async () => {
    try { return (await (await fetch("/cgi-bin/routerinfo", {cache: "no-store", signal: AbortSignal.timeout(4000)})).json()).uptime; }
    catch (e) { return null; }
  };
  let wentDown = false, lastUp = await ping();
  for (;;) {
    await new Promise(r => setTimeout(r, 3000));
    const up = await ping(), el_ = (Date.now() - t0) / 1000 | 0;
    if (up == null) wentDown = true;
    else if (wentDown || (lastUp != null && up < lastUp)) { st.textContent = "Back. Reloading…"; sessionStorage.removeItem("admin-sid"); location.reload(); return; }
    if (up != null) lastUp = up;
    st.textContent = (wentDown ? "Restarting… " : "Waiting for the router to go down… ") + `${el_} s` +
      (el_ > expectSecs ? ". This is taking longer than usual; keep this page open." : "");
  }
}

/* ---------- time zones, from the browser's own data ---------- */
function tzOffset(zone, t) {
  const s = new Intl.DateTimeFormat("en-US", {timeZone: zone, timeZoneName: "longOffset"}).formatToParts(t).find(p => p.type == "timeZoneName").value;
  const m = /([+-])(\d\d):(\d\d)/.exec(s);
  return m ? (m[1] == "-" ? -1 : 1) * (m[2] * 60 + +m[3]) : 0;
}
function tzAbbr(zone, t, off) {
  for (const loc of ["en-US", "en-GB"]) {
    const n = new Intl.DateTimeFormat(loc, {timeZone: zone, timeZoneName: "short"}).formatToParts(t).find(p => p.type == "timeZoneName").value;
    if (/^[A-Z]{3,5}$/.test(n) && (!/^(GMT|UTC)$/.test(n) || !off)) return n;
  }
  const a = Math.abs(off);
  return "<" + (off < 0 ? "-" : "+") + String(a / 60 | 0).padStart(2, "0") + (a % 60 ? String(a % 60).padStart(2, "0") : "") + ">";
}
function tzPosix(zone, year = new Date().getFullYear()) {
  const hm = m => { const a = Math.abs(m); return (m < 0 ? "-" : "") + (a / 60 | 0) + (a % 60 ? ":" + String(a % 60).padStart(2, "0") : ""); };
  const t0 = Date.UTC(year, 0, 1), tr = [];
  let prev = tzOffset(zone, t0);
  for (let t = t0 + 864e5; t <= Date.UTC(year + 1, 0, 1); t += 864e5) {
    const o = tzOffset(zone, t);
    if (o == prev) continue;
    let lo = t - 864e5, hi = t;
    while (hi - lo > 6e4) { const mid = lo + Math.floor((hi - lo) / 12e4) * 6e4; if (tzOffset(zone, mid) == prev) lo = mid; else hi = mid; }
    tr.push({t: hi, from: prev, to: o}); prev = o;
  }
  if (tr.length != 2) { const o = tzOffset(zone, Date.now()); return tzAbbr(zone, Date.now(), o) + hm(-o); }
  const start = tr[0].to > tr[0].from ? tr[0] : tr[1], end = start == tr[0] ? tr[1] : tr[0];
  const rule = x => {
    const d = new Date(x.t + x.from * 6e4), day = d.getUTCDate(), dim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
    const mins = d.getUTCHours() * 60 + d.getUTCMinutes();
    return `M${d.getUTCMonth() + 1}.${day + 7 > dim ? 5 : Math.ceil(day / 7)}.${d.getUTCDay()}` + (mins == 120 ? "" : "/" + hm(mins));
  };
  return tzAbbr(zone, start.t - 6e4, start.from) + hm(-start.from) + tzAbbr(zone, start.t, start.to) +
    (start.to - start.from == 60 ? "" : hm(-start.to)) + "," + rule(start) + "," + rule(end);
}

/* ---------- Status ---------- */
async function lanNames() {
  try {
    const r = await call("lanwatch", "devices");
    return Object.fromEntries((r.devices || []).map(d => [d.mac.toLowerCase(), d]));
  } catch (e) { return {}; }
}
async function viewStatus(v) {
  const grid = el("div", {class: "grid"}), clients = el("div");
  v.append(grid, el("div", {style: "height:14px"}), clients);
  const tick = async () => {
    const [board, info, ri, dump, wdevs] = await Promise.all([call("system", "board"), call("system", "info"),
      fetch("/cgi-bin/routerinfo", {cache: "no-store"}).then(r => r.json()).catch(() => null),
      call("network.interface", "dump"), call("iwinfo", "devices").catch(() => ({devices: []}))]);
    const dev = (wdevs.devices || [])[0];
    const [wi, assoc, names] = dev ? await Promise.all([call("iwinfo", "info", {device: dev}).catch(() => null),
      call("iwinfo", "assoclist", {device: dev}).catch(() => ({results: []})), lanNames()]) : [null, {results: []}, {}];
    $("who").textContent = `${board.hostname} · ${board.model}`;
    const lt = new Date(info.localtime * 1000).toLocaleString(undefined, {timeZone: "UTC", dateStyle: "medium", timeStyle: "short"});
    const ifs = (dump.interface || []).filter(i => i.interface != "loopback");
    const lan = ifs.find(i => i.interface == "lan") || ifs.find(i => i.up) || {};

    procBox.replaceChildren(el("p", {class: "hint", style: "margin:0 0 8px", text: `${list.length} of ${procs.length} processes · Memory: ${procMem}`}),
      el("div", {class: "scroll"}, el("table", null,
        el("thead", null, el("tr", null, el("th", {class: "num"}, sh("PID", "pid")), el("th", {text: "User"}), el("th", {class: "num"}, sh("CPU", "cpu")),
          el("th", {class: "num"}, sh("Memory", "mem")), el("th", {text: "Command"}), el("th"))),
        el("tbody", null, list.map(p => {
          const b = (label, sig) => { const x = el("button", {class: "small" + (sig == 9 ? " danger" : ""), text: label}); x.onclick = () => signal(p, sig, label); return x; };
          return el("tr", null, el("td", {class: "num", text: p.pid}), el("td", {text: p.user}), el("td", {class: "num", text: p.cpu + "%"}),
            el("td", {class: "num", text: `${p.vsz} (${p.mem}%)`}), el("td", {class: "cmd mono", text: p.cmd}),
            el("td", null, p.pid == 1 ? null : el("div", {class: "inline", style: "flex-wrap:nowrap"}, b("Hang up", 1), b("Terminate", 15), b("Kill", 9))));
        })))));
  };
  pfilt.oninput = showProcs; kthreads.onchange = showProcs;
  prefresh.onclick = () => busy(prefresh, () => loadProcs().catch(e => procBox.replaceChildren(errBox(e))));
  // Log
  const logPre = el("pre", {class: "log mono"}), filt = el("input", {type: "text", placeholder: "Filter", style: "max-width:220px"});
  let logText = "";
  const showLog = () => { const f = filt.value.toLowerCase(); logPre.textContent = logText.split("\n").filter(l => !f || l.toLowerCase().includes(f)).join("\n"); toBottom(logPre); };
  const loadLog = async () => { const r = await exec("/sbin/logread", ["-l", 300]); logText = (r.stdout || "").trimEnd(); showLog(); };
  filt.oninput = showLog;
  const refresh = el("button", {class: "small", text: "Refresh"}); refresh.onclick = () => busy(refresh, loadLog);
  // Restart
  const reboot = el("button", {class: "danger", text: "Restart router"});
  reboot.onclick = async () => {
    if (!await confirmAct("Restart the router?", ["Its Wi-Fi and this page are unavailable for about a minute."], "Restart", "danger")) return;
    try { await helper("bg", "/sbin/reboot"); } catch (e) { toast(e.message); return; }
    waitForRouter("Restarting", "The router is restarting. This page reloads when it's back.", 120);
  };
  v.append(
    pair(card("Router",
      field("Hostname", host, "Also its name on the network: " + (s.hostname || "openwrt").toLowerCase() + ".local"),
      field("Time zone", zone, el("span", null, `Router time: ${rtime}. `, useMine)),
      err1, el("div", {class: "btns"}, save1)),
    card("Password", el("p", {class: "hint", text: "The root password, used for this page and SSH (and LuCI, where installed)."}),
      field("New password", p1), field("Repeat it", p2), err2, el("div", {class: "btns"}, save2))),
    card("Services", svcBox),
    card("Processes", el("div", {class: "inline", style: "margin-bottom:10px"}, pfilt, el("label", {class: "check", style: "padding:0"}, kthreads, "Kernel threads"), prefresh),
      procBox, el("p", {class: "hint", text: "CPU is measured over one second. Memory is the virtual size in KB (m = MB) and its share of RAM."})),
    card("System log", el("div", {class: "inline", style: "margin-bottom:10px"}, filt, refresh), logPre),
    card("Restart", el("p", {class: "hint", text: "Services save their data before the restart."}), el("div", {class: "btns"}, reboot)));
  await Promise.all([loadSvcs(), loadLog(), loadProcs().catch(e => procBox.replaceChildren(errBox(e)))]);
}

/* ---------- Backup & firmware ---------- */
function upload(path, file, onprogress) {
  return new Promise((res, rej) => {
    const fd = new FormData();
    fd.append("sessionid", sid); fd.append("filename", path); fd.append("filemode", "0600"); fd.append("filedata", file);
    const x = new XMLHttpRequest();
    x.open("POST", "/cgi-bin/cgi-upload");
    x.upload.onprogress = e => onprogress && e.lengthComputable && onprogress(e.loaded / e.total);
    x.onload = () => {
      let j = null; try { j = JSON.parse(x.responseText); } catch (e) { /* not JSON */ }
      if (j && j.size != null) res(j);
      else rej(new Error(j && j.message ? j.message + (j.failure ? ` (${j.failure[1]})` : "") : x.responseText.trim() || "Upload failed."));
    };
    x.onerror = () => rej(new Error("Upload failed: can't reach the router."));
    x.send(fd);
  });
}
async function viewMaintenance(v) {
  const ri = await fetch("/cgi-bin/routerinfo", {cache: "no-store"}).then(r => r.json()).catch(() => null);
  // Backup
  const dl = el("button", {class: "primary", text: "Download backup"});
  dl.onclick = () => busy(dl, async () => {
    // cgi-io's own backup download is broken in 15.05 (truncated chunked reply), so: create, read as base64, delete
    const tmp = "/tmp/admin-backup.tar.gz";
    try {
      await helper("backup", tmp);
      const r = await call("file", "read", {path: tmp, base64: true}).finally(() => exec("/bin/rm", ["-f", tmp]).catch(() => {}));
      const bin = Uint8Array.from(atob(r.data.replace(/\s/g, "")), ch => ch.charCodeAt(0));
      const b = await call("system", "board"), day = new Date().toISOString().slice(0, 10);
      const a = el("a", {href: URL.createObjectURL(new Blob([bin], {type: "application/gzip"})), download: `backup-${b.hostname}-${day}.tar.gz`});
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch (e) { toast(e.message); }
  });
  // Restore
  const rfile = el("input", {type: "file", accept: ".tar.gz,.tgz,application/gzip"}), rerr = el("p", {class: "err", hidden: true});
  const rbtn = el("button", {text: "Restore…"});
  rbtn.onclick = () => busy(rbtn, async () => {
    rerr.hidden = true;
    const f = rfile.files[0];
    if (!f) { rerr.textContent = "Choose a backup file first."; rerr.hidden = false; return; }
    try {
      await call("session", "access", {scope: "cgi-io", object: "upload", function: "write"});
      await upload("/tmp/backup.tar.gz", f);
      const t = await exec("/bin/tar", ["-tzf", "/tmp/backup.tar.gz"]);
      const files = (t.stdout || "").split("\n").filter(Boolean);
      if (t.code || !files.length) throw new Error("That isn't a backup made by this kind of router (not a .tar.gz archive).");
      const odd = files.filter(x => !/^(\.\/)?etc\//.test(x));
      const ok = await confirmAct("Restore this backup?", [
        `It contains ${files.length} files${odd.length ? `, including ${odd.length} outside /etc` : ""}. They replace the current settings, then the router restarts.`,
        el("pre", {class: "log mono", style: "max-height:160px", text: files.join("\n")})], "Restore and restart", "danger");
      if (!ok) { await exec("/bin/rm", ["-f", "/tmp/backup.tar.gz"]); return; }
      await helper("restore", "/tmp/backup.tar.gz");
      await helper("bg", "/sbin/reboot");
      waitForRouter("Restoring", "The settings were restored and the router is restarting.", 120);
    } catch (e) {
      exec("/bin/rm", ["-f", "/tmp/backup.tar.gz"]).catch(() => {});
      rerr.textContent = e.message; rerr.hidden = false;
    }
  });
  // Firmware
  const ffile = el("input", {type: "file", accept: ".bin"}), ferr = el("p", {class: "err", hidden: true}), fout = el("div");
  const fbtn = el("button", {text: "Upload and check…"}), prog = el("progress", {max: 1, value: 0, hidden: true});
  fbtn.onclick = () => busy(fbtn, async () => {
    ferr.hidden = true; fout.replaceChildren();
    const f = ffile.files[0];
    if (!f) { ferr.textContent = "Choose a firmware file first."; ferr.hidden = false; return; }
    try {
      const mem = await fetch("/cgi-bin/routerinfo", {cache: "no-store"}).then(r => r.json());
      if (mem.mem_available_kb * 1024 < f.size * 2 + 2097152)     // the upload is staged in RAM twice
        throw new Error(`Not enough free memory for a ${fmtMB(f.size)} file (${fmtMB(mem.mem_available_kb * 1024)} free). Stopping services such as lanwatch first can help.`);
      await call("session", "access", {scope: "cgi-io", object: "upload", function: "write"});
      prog.hidden = false; prog.value = 0;
      const up = await upload("/tmp/firmware.bin", f, p => { prog.value = p; fbtn.textContent = `Uploading ${Math.round(p * 100)}%`; });
      prog.hidden = true; fbtn.textContent = "Checking…";
      const t = await call("rpc-sys", "upgrade_test");
      const good = t.code === 0, msg = (t.stderr || t.stdout || "").trim();
      const keep = el("input", {type: "checkbox", checked: true}), flash = el("button", {class: "danger", text: "Flash firmware", disabled: !good});
      const cancel = el("button", {text: "Cancel"});
      cancel.onclick = async () => { await call("rpc-sys", "upgrade_clean").catch(() => {}); fout.replaceChildren(); toast("Firmware file removed."); };
      flash.onclick = async () => {
        if (!await confirmAct("Flash this firmware?", [
          "Don't unplug the router while it's flashing: that can leave it unable to start. It takes a few minutes.",
          keep.checked ? "Settings are kept. Programs added after the current firmware was flashed are removed, unless the new firmware includes them."
            : "All settings are erased: the router comes back at 192.168.1.1 with its own DHCP server, which can disturb this network."], "Flash", "danger")) return;
        await call("rpc-sys", "upgrade_start", {keep: keep.checked});
        waitForRouter("Flashing firmware", "Don't unplug the router. This page reloads when it's back" + (keep.checked ? "." : " (if it comes back at this address)."), 300);
      };
      fout.replaceChildren(kv([["File", f.name], ["Size", `${up.size.toLocaleString()} bytes`], ["MD5", el("span", {class: "mono", text: up.checksum})],
        ["Check", good ? el("span", {class: "ok", text: "Valid image for this router"}) : el("span", {class: "err", text: "Rejected" + (msg ? ": " + msg : "")})]]),
        el("p", {class: "hint", text: "Compare the MD5 with the one published for the download."}),
        field("Keep settings", el("label", {class: "check"}, keep, "Keep the current configuration")),
        el("div", {class: "btns"}, flash, cancel));
    } catch (e) { prog.hidden = true; ferr.textContent = e.message; ferr.hidden = false; }
  });
  // Factory reset
  const reset = el("button", {class: "danger", text: "Reset to factory settings…"});
  reset.onclick = async () => {
    if (!await confirmAct("Erase all settings?", ["Everything changed since the firmware was flashed is erased: settings, passwords and any programs added afterwards. Programs built into the firmware stay.",
      "The router comes back at 192.168.1.1 with its own DHCP server, which can disturb this network."], "Erase everything", "danger")) return;
    try { await call("rpc-sys", "factory"); } catch (e) { toast(e.message); return; }
    waitForRouter("Resetting", "The router is erasing its settings and restarting. It will come back at 192.168.1.1, not here.", 180);
  };
  v.append(
    pair(card("Backup", el("p", {class: "hint", text: "The configuration files (/etc/config and others listed for keeping), as a .tar.gz. It includes the password hash and Wi-Fi password: keep it private."}), el("div", {class: "btns"}, dl)),
    card("Restore", field("Backup file", rfile), rerr, el("div", {class: "btns"}, rbtn))),
    pair(card("Firmware upgrade", el("p", {class: "hint", text: "Use the “sysupgrade” image for this exact model. It's checked before anything is written." +
        (ri ? ` Free memory: ${fmtMB(ri.mem_available_kb * 1024)}.` : "")}),
      field("Firmware file", ffile), prog, ferr, el("div", {class: "btns"}, fbtn), fout),
    card("Factory reset", el("p", {class: "hint", text: "Erases all settings, and programs added after the firmware was flashed."}), el("div", {class: "btns"}, reset))));
}

/* ---------- routing ---------- */
const VIEWS = {status: viewStatus, wifi: viewWifi, network: viewNetwork, system: viewSystem, maintenance: viewMaintenance};
let routeSeq = 0;
async function route() {
  const name = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "status", seq = ++routeSeq;
  timers.forEach(clearInterval); timers = [];
  document.querySelectorAll("#tabs a").forEach(a => a.toggleAttribute("aria-current", a.hash == "#" + name));
  const v = el("div", null, el("p", {class: "muted", text: "Loading…"}));
  $("view").replaceChildren(v);
  try {
    const body = el("div");
    await VIEWS[name](body);
    if (seq == routeSeq) v.replaceChildren(body);
  } catch (e) { if (seq == routeSeq) v.replaceChildren(card("Couldn't load this page", errBox(e))); }
}
$("logout").onclick = async () => {
  await call("session", "destroy", {}, false).catch(() => {});
  sessionStorage.removeItem("admin-sid"); sid = ""; location.hash = ""; location.reload();
};
(async () => {
  const m = /^#keep=([0-9a-f]{32})$/.exec(location.hash);    // arrived from the old address after a LAN change
  if (m) { sid = m[1]; sessionStorage.setItem("admin-sid", sid); history.replaceState(null, "", location.pathname); }
  if (!sid) await relogin();
  else await call("session", "access", {scope: "ubus", object: "file", function: "exec"}).then(r => r.access || relogin(), () => relogin());
  $("tabs").hidden = false; $("logout").hidden = false;
  call("system", "board").then(b => { $("who").textContent = `${b.hostname} · ${b.model}`; }).catch(() => {});
  try { if ((await helper("status")).startsWith("pending")) await pendingDialog(); } catch (e) { /* helper missing: page still works read-only */ }
  addEventListener("hashchange", route);
  route();
})();
