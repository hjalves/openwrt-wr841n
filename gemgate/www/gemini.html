<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Gemini</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--wash:rgba(11,11,11,.05);--accent:#2a78d6;--bad:#d03b3b;--warn:#a86b00;--good:#0ca30c}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.06);--accent:#5a9df0;--bad:#ef6b6b;--warn:#e0a23a;--good:#3ccf5a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.back{color:var(--text2);text-decoration:none;font-size:13px}.back:hover{color:var(--text);text-decoration:underline}
h1.title{font-size:20px;font-weight:600;margin:0}
form.bar{display:flex;gap:6px;margin-bottom:6px}
form.bar input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
button{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--wash)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{min-height:20px;font-size:12px;color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}
.status b{color:var(--text2);font-weight:600}
.status .new{color:var(--warn)}
article{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;overflow-wrap:anywhere}
article.loading{opacity:.55}
article h1{font-size:24px;line-height:1.25;margin:.2em 0 .5em}
article h2{font-size:19px;line-height:1.3;margin:1.1em 0 .4em}
article h3{font-size:16px;margin:1em 0 .3em}
article p{margin:0 0 .55em;white-space:pre-wrap}
article p.blank{margin:0;height:.6em}
article ul{margin:.2em 0 .7em;padding-left:1.3em}
article blockquote{margin:.4em 0 .8em;padding:.1em 0 .1em 12px;border-left:3px solid var(--border);color:var(--text2);white-space:pre-wrap}
article pre{background:var(--wash);border-radius:8px;padding:10px 12px;overflow:auto;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:.4em 0 .9em;white-space:pre}
article .link{margin:0 0 .35em}
article .link a{color:var(--accent);text-decoration:none}
article .link a:hover{text-decoration:underline}
article .link .scheme{color:var(--muted);font-size:12px;margin-left:6px}
article img{max-width:100%;height:auto;display:block;margin:auto;border-radius:6px}
.err h2{color:var(--bad);margin-top:0}
.err .hint{color:var(--text2);font-size:14px}
.fp{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--text2);overflow-wrap:anywhere}
form.input{display:flex;flex-direction:column;gap:10px;max-width:520px}
form.input label{font-weight:600}
form.input input{font:inherit;color:var(--text);background:var(--page);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}
</style>
</head>
<body>
<main>
<header>
  <div><a class="back" href="/">← Home</a><h1 class="title">Gemini</h1></div>
</header>
<form class="bar" id="bar">
  <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Gemini address" placeholder="gemini://…">
  <button class="primary" type="submit">Go</button>
  <button type="button" id="home" title="Home: gemini.hjalves.dev">Home</button>
</form>
<p class="status" id="status" role="status"></p>
<article id="page"></article>
</main>
<script>
"use strict";
const GATEWAY = "/cgi-bin/gemini", HOME = "gemini://gemini.hjalves.dev/", MAX_REDIRECTS = 5;
const $ = id => document.getElementById(id);
let seq = 0, blobUrl = null;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    if (k === "text") e.textContent = props[k];
    else if (k === "class") e.className = props[k];
    else e.setAttribute(k, props[k]);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}

// Resolve a link against the current page. Browsers parse gemini:// as a
// hierarchical URL, so relative paths, "..", "?query" all work.
function resolve(href, base) {
  try { return new URL(href, base).href; } catch (e) { return null; }
}
function normalize(input) {
  let s = input.trim();
  if (!s) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = "gemini://" + s;
  try {
    const u = new URL(s);
    if (u.protocol === "gemini:" && !u.pathname) u.pathname = "/";
    return u.href;
  } catch (e) { return null; }
}

// ---- gemtext ----
function renderGemtext(text, base) {
  const out = document.createDocumentFragment();
  let pre = null, list = null, firstH1 = null;
  const endList = () => { list = null; };
  for (const raw of text.replace(/\r\n/g, "\n").split("\n")) {
    if (pre) {
      if (raw.startsWith("```")) { pre = null; continue; }
      pre.textContent += (pre.textContent ? "\n" : "") + raw;
      continue;
    }
    if (raw.startsWith("```")) {
      endList();
      pre = el("pre");
      const alt = raw.slice(3).trim();
      if (alt) pre.setAttribute("aria-label", alt);
      out.append(pre);
      continue;
    }
    if (raw.startsWith("* ")) {
      if (!list) out.append(list = el("ul"));
      list.append(el("li", {text: raw.slice(2)}));
      continue;
    }
    endList();
    let m;
    if ((m = /^=>\s*(\S+)(?:\s+(.*))?$/.exec(raw))) {
      const target = resolve(m[1], base), label = (m[2] || "").trim() || m[1];
      const div = el("div", {class: "link"}), scheme = target ? new URL(target).protocol.slice(0, -1) : "";
      if (target && scheme === "gemini") {
        const a = el("a", {href: "#" + encodeURIComponent(target), text: label, title: target});
        div.append("⇒ ", a);
      } else if (target && (scheme === "http" || scheme === "https")) {
        div.append("⇒ ", el("a", {href: target, target: "_blank", rel: "noopener noreferrer", text: label, title: target}), el("span", {class: "scheme", text: scheme}));
      } else {
        div.append("⇒ ", el("span", {text: label, title: target || m[1]}), el("span", {class: "scheme", text: scheme || "invalid link"}));
      }
      out.append(div);
    } else if ((m = /^(#{1,3})\s*(.*)$/.exec(raw))) {
      const h = el("h" + m[1].length, {text: m[2]});
      if (m[1].length === 1 && !firstH1) firstH1 = m[2];
      out.append(h);
    } else if (raw.startsWith(">")) {
      out.append(el("blockquote", {text: raw.slice(1).replace(/^ /, "")}));
    } else if (!raw.trim()) {
      out.append(el("p", {class: "blank"}));
    } else {
      out.append(el("p", {text: raw}));
    }
  }
  return {node: out, title: firstH1};
}

// ---- fetching through the gateway ----
function setStatus(parts) {
  const s = $("status");
  s.replaceChildren(...parts);
}
function showError(title, message, extra) {
  $("page").className = "err";
  $("page").replaceChildren(el("h2", {text: title}), el("p", {class: "hint", text: message}), extra || "");
}

async function go(url, opts = {}) {
  const my = ++seq, started = performance.now();
  $("addr").value = url;
  $("page").classList.add("loading");
  setStatus([el("b", {text: "Loading…"}), " " + url]);
  let res;
  try {
    res = await fetch(GATEWAY + "?url=" + encodeURIComponent(url) + (opts.trust ? "&trust=" + opts.trust : ""), {cache: "no-store"});
  } catch (e) {
    if (my !== seq) return;
    $("page").classList.remove("loading");
    setStatus([el("b", {text: "Error"})]);
    return showError("Can't reach the gateway", "The gateway didn't answer: " + e.message);
  }
  if (my !== seq) return;
  const ms = Math.round(performance.now() - started), h = n => res.headers.get(n);
  $("page").classList.remove("loading");
  if (!res.ok) {
    const code = h("X-Gateway-Error") || "error", text = (await res.text()).trim();
    setStatus([el("b", {text: `Gateway: ${code}`}), ` · ${ms} ms`]);
    if (code === "cert-changed") {
      const btn = el("button", {class: "primary", text: "Trust the new certificate"});
      btn.onclick = () => go(url, {trust: h("X-Gemini-Cert")});
      return showError("The site's certificate has changed",
        "This site presented a different certificate than the one stored on your first visit. Sites do renew certificates; it could also mean someone is intercepting the connection.",
        el("div", {}, el("p", {class: "fp", text: "Stored:    " + h("X-Gemini-Cert-Known")}), el("p", {class: "fp", text: "Presented: " + h("X-Gemini-Cert")}), el("div", {class: "btns"}, btn)));
    }
    return showError({"bad-url": "Invalid address", "bad-request": "Invalid request", "dns": "Unknown host", "connect": "Can't connect",
                      "timeout": "Timed out", "tls": "Secure connection failed", "blocked-address": "Local address refused",
                      "bad-response": "Invalid response"}[code] || "Gateway error", text);
  }
  const status = +h("X-Gemini-Status"), meta = decodeURIComponent(h("X-Gemini-Meta") || ""), certStatus = h("X-Gemini-Cert-Status");
  const parts = [el("b", {text: String(status)}), " " + (meta || "") + ` · ${ms} ms`];
  if (certStatus === "new") parts.push(" · ", el("span", {class: "new", text: "certificate stored (first visit)"}));
  if (certStatus === "replaced") parts.push(" · ", el("span", {class: "new", text: "certificate replaced"}));
  if (opts.redirectedFrom) parts.push(" · redirected from " + opts.redirectedFrom);
  setStatus(parts);

  if (status >= 10 && status < 20) return showInput(url, meta, status === 11);
  if (status >= 30 && status < 40) {
    const target = resolve(meta, url);
    if (!target) return showError("Invalid redirect", `The server redirected to "${meta}".`);
    if ((opts.redirects || 0) >= MAX_REDIRECTS) return showError("Too many redirects", `Stopped after ${MAX_REDIRECTS} redirects; the last one pointed to ${target}.`);
    if (!target.startsWith("gemini://")) return showError("Redirect to another protocol", "The server redirected outside Gemini: " + target);
    history.replaceState(null, "", "#" + encodeURIComponent(target));
    return go(target, {redirects: (opts.redirects || 0) + 1, redirectedFrom: opts.redirectedFrom || url});
  }
  if (status >= 20 && status < 30) return showBody(res, url, meta);
  const kind = status >= 60 ? "Client certificate required" : status >= 50 ? "Permanent failure" : status >= 40 ? "Temporary failure" : "Unexpected answer";
  showError(`${kind} (${status})`, meta || "The server gave no explanation." +
    (status >= 60 ? " This page needs a client certificate, which the gateway doesn't support." : ""));
}

async function showBody(res, url, meta) {
  const mime = (meta || "text/gemini").split(";")[0].trim().toLowerCase();
  const charset = (/charset=([^;\s]+)/i.exec(meta) || [, "utf-8"])[1];
  const page = $("page");
  page.className = "";
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  if (mime === "text/gemini" || mime.startsWith("text/")) {
    let text;
    try { text = new TextDecoder(charset).decode(await res.arrayBuffer()); }
    catch (e) { text = new TextDecoder("utf-8").decode(await res.arrayBuffer().catch(() => new ArrayBuffer(0))); }
    if (mime === "text/gemini") {
      const r = renderGemtext(text, url);
      page.replaceChildren(r.node);
      document.title = (r.title ? r.title + " · " : "") + "Gemini";
    } else {
      page.replaceChildren(el("pre", {text}));
      document.title = url + " · Gemini";
    }
  } else {
    const blob = await res.blob();
    blobUrl = URL.createObjectURL(blob);
    const name = decodeURIComponent(new URL(url).pathname.split("/").pop() || "download");
    if (mime.startsWith("image/")) page.replaceChildren(el("img", {src: blobUrl, alt: name}), el("p", {class: "note", text: `${mime} · ${blob.size.toLocaleString()} bytes`}));
    else page.replaceChildren(el("p", {text: `This is a ${mime} file (${blob.size.toLocaleString()} bytes).`}), el("div", {class: "btns"}, el("a", {href: blobUrl, download: name, text: "Download " + name})));
    document.title = name + " · Gemini";
  }
  window.scrollTo(0, 0);
}

function showInput(url, prompt, sensitive) {
  const input = el("input", {type: sensitive ? "password" : "text", id: "q", autocomplete: "off"});
  const form = el("form", {class: "input"}, el("label", {for: "q", text: prompt || "Input requested"}), input,
                  el("div", {class: "btns"}, el("button", {class: "primary", type: "submit", text: "Send"})));
  form.onsubmit = e => {
    e.preventDefault();
    const u = new URL(url);
    u.search = "?" + encodeURIComponent(input.value).replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase());
    location.hash = encodeURIComponent(u.href);
  };
  $("page").className = "";
  $("page").replaceChildren(form);
  input.focus();
}

// The address lives in the URL's # part, so Back/Forward and bookmarks work.
function route() {
  const target = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : HOME;
  go(target);
}
$("bar").onsubmit = e => {
  e.preventDefault();
  const u = normalize($("addr").value);
  if (!u) return showError("Invalid address", "Enter a gemini:// address, or a host name such as geminiprotocol.net.");
  if (location.hash === "#" + encodeURIComponent(u)) go(u); else location.hash = encodeURIComponent(u);
};
$("home").onclick = () => { location.hash = encodeURIComponent(HOME); };
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
