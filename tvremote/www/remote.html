<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>TV remote</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--wash:rgba(11,11,11,.06);--press:rgba(11,11,11,.14);--series-1:#2a78d6;--good:#0ca30c;--critical:#d03b3b;--warning:#fab219}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface-1:#1a1a19;--text-primary:#f0efec;--text-secondary:#c3c2b7;--border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.07);--press:rgba(255,255,255,.16);--series-1:#3987e5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page)}
.viz-root{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text-primary);max-width:380px;margin:0 auto;padding:20px 16px 40px;user-select:none;-webkit-user-select:none}
h1{font-size:20px;font-weight:600;margin:0}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.back{display:inline-block;color:var(--text-secondary);text-decoration:none;font-size:13px;margin-bottom:2px}
@media (hover:hover){.back:hover{color:var(--text-primary);text-decoration:underline}.k:hover{background:var(--wash)}}
.status{margin:0;color:var(--text-secondary);font-size:13px;text-align:right}
.status b{font-weight:600;color:var(--text-primary)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.dot.on{background:var(--good)}.dot.busy{background:var(--warning)}.dot.err{background:var(--critical)}
.msg{min-height:18px;margin:-8px 0 8px;color:var(--critical);font-size:12px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad.top{grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
.pad.top .k{font-size:13px}
.k{display:flex;align-items:center;justify-content:center;gap:4px;min-height:52px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1);color:var(--text-primary);font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation;transition:background .08s}
.k.down,.k:active{background:var(--press)}
.k:focus-visible{outline:2px solid var(--series-1);outline-offset:2px}
.k svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.k small{color:var(--text-secondary);font-size:12px}
.pad.colors{grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.pad.colors .k{min-height:44px;gap:8px;font-weight:600}
.pad.colors i{width:14px;height:14px;border-radius:50%;display:inline-block}
.power{color:var(--critical)}
.power.on{color:var(--good)}
.gap{margin-top:16px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,64px);gap:8px;margin:16px auto 0;max-width:260px}
.dpad .k{min-height:0;border-radius:14px}
.dpad .ok{border-radius:50%;font-weight:600;background:var(--wash)}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .ok{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .dn{grid-column:2;grid-row:3}
.rocker{display:grid;grid-template-rows:1fr auto 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-1)}
.rocker .k{border:0;border-radius:0;min-height:48px}
.rocker span{text-align:center;color:var(--muted);font-size:11px;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
details{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1)}
summary{padding:10px 14px;cursor:pointer;color:var(--text-secondary);font-size:13px}
details .pad{padding:0 10px 10px}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
@media (max-width:560px){.viz-root{padding-top:12px;padding-bottom:12px}}
@media (hover:none) and (pointer:coarse){.hint{display:none}}  /* keyboard hint: no use on a touch-only phone */
.off .ctl{opacity:.45}
.vol{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1);padding:10px 14px 6px}
.vol[hidden],.apps[hidden]{display:none}
.apps{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1)}
.apps summary{padding:10px 14px;cursor:pointer;color:var(--text-secondary);font-size:13px}
.appgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 10px}
.appgrid .k{min-width:0;min-height:44px;padding:0 10px;font-size:13px;justify-content:flex-start}
.appgrid .k span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.info{color:var(--text-secondary)}
.volhead{display:flex;justify-content:space-between;align-items:baseline;color:var(--text-secondary);font-size:13px}
.volhead b{color:var(--text-primary);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.vol input{width:100%;height:32px;margin:2px 0 0;accent-color:var(--series-1);touch-action:pan-y}
.vol.muted b{color:var(--critical)}
.vol.muted input{opacity:.5}
</style>
</head>
<body>
<main class="viz-root" id="root">
<header>
  <div><a class="back" href="/">← Home</a><h1>TV remote</h1></div>
  <p class="status" id="status" role="status"><span class="dot" id="dot"></span><span id="stateText">Loading…</span></p>
</header>
<p class="msg" id="msg" aria-live="polite"></p>

<div class="pad top">
  <button class="k power" id="power" aria-label="Power"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 7a8 8 0 1 0 11.4 0"/></svg><small id="powerText">Power</small></button>
  <button class="k ctl" data-key="KEY_SOURCE">Source</button>
  <button class="k ctl" data-key="KEY_HDMI" aria-label="Next HDMI input">HDMI</button>
  <button class="k ctl" data-key="KEY_MENU">Menu</button>
</div>

<div class="dpad ctl">
  <button class="k up" data-key="KEY_UP" data-repeat aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button class="k left" data-key="KEY_LEFT" data-repeat aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button class="k ok" data-key="KEY_ENTER">OK</button>
  <button class="k right" data-key="KEY_RIGHT" data-repeat aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="k dn" data-key="KEY_DOWN" data-repeat aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>

<div class="pad gap ctl">
  <button class="k" data-key="KEY_RETURN" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><small>Back</small></button>
  <button class="k" data-key="KEY_HOME" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><small>Home</small></button>
  <button class="k" data-key="KEY_EXIT">Exit</button>
</div>

<div class="pad gap ctl" style="grid-template-columns:1fr 1fr 1fr">
  <div class="rocker">
    <button class="k" data-key="KEY_VOLUP" data-repeat aria-label="Volume up">+</button>
    <span>Vol</span>
    <button class="k" data-key="KEY_VOLDOWN" data-repeat aria-label="Volume down">−</button>
  </div>
  <div style="display:grid;gap:10px">
    <button class="k" data-key="KEY_MUTE" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg></button>
    <button class="k" data-key="KEY_INFO">Info</button>
  </div>
  <div class="rocker">
    <button class="k" data-key="KEY_CHUP" data-repeat aria-label="Channel up">+</button>
    <span>Ch</span>
    <button class="k" data-key="KEY_CHDOWN" data-repeat aria-label="Channel down">−</button>
  </div>
</div>

<div class="vol" id="volBox" hidden>
  <label class="volhead" for="vol"><span>Volume</span><b id="volVal">–</b></label>
  <input type="range" id="vol" min="0" max="100" step="1">
</div>

<details class="apps" id="appsBox" hidden>
  <summary>Apps</summary>
  <div class="appgrid" id="apps"></div>
</details>

<details class="ctl">
  <summary>Playback &amp; color keys</summary>
  <div class="pad colors">
    <button class="k" data-key="KEY_RED" aria-label="Red key (A)"><i style="background:#e0423b"></i>A</button>
    <button class="k" data-key="KEY_GREEN" aria-label="Green key (B)"><i style="background:#2fa84f"></i>B</button>
    <button class="k" data-key="KEY_YELLOW" aria-label="Yellow key (C)"><i style="background:#f2c12e"></i>C</button>
    <button class="k" data-key="KEY_CYAN" aria-label="Blue key (D)"><i style="background:#2f7fe0"></i>D</button>
  </div>
  <div class="pad">
    <button class="k" data-key="KEY_REWIND" aria-label="Rewind"><svg viewBox="0 0 24 24"><path d="M11 18l-7-6 7-6zM20 18l-7-6 7-6z"/></svg></button>
    <button class="k" data-key="KEY_PLAY" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>
    <button class="k" data-key="KEY_FF" aria-label="Fast forward"><svg viewBox="0 0 24 24"><path d="M13 18l7-6-7-6zM4 18l7-6-7-6z"/></svg></button>
    <button class="k" data-key="KEY_PAUSE" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="k" data-key="KEY_STOP" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    <button class="k" data-key="KEY_GUIDE">Guide</button>
  </div>
</details>

<details class="ctl">
  <summary>Numbers</summary>
  <div class="pad" id="digits"></div>
</details>

<p class="hint">Keyboard: arrows, Enter, Backspace (back), Esc (exit), H (home), + / − (volume), M (mute)</p>
</main>

<script>
"use strict";
const ANON = "00000000000000000000000000000000";
const $ = id => document.getElementById(id);
let rpcId = 0, tv = null, pollTimer = null, msgTimer = null;

async function rpc(method, args) {
  const r = await fetch("/ubus", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({jsonrpc: "2.0", id: ++rpcId, method: "call", params: [ANON, "tv", method, args || {}]})});
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error.code === -32000 ? "tvremote isn't running" : j.error.message || "RPC error");
  if (j.result[0] !== 0) {
    const e = new Error({9: "The TV is off", 2: "Not a valid key", 4: "tvremote isn't running"}[j.result[0]] || "ubus status " + j.result[0]);
    e.code = j.result[0];
    throw e;
  }
  return j.result[1] || {};
}

function say(text, info) {
  $("msg").textContent = text || "";
  $("msg").classList.toggle("info", !!info);
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => { $("msg").textContent = ""; }, 4000);
}

const LABEL = {off: "Off", waking: "Switching on…", on: "On", turning_off: "Switching off…"};
function show(s) {
  tv = s;
  const st = s.state, busy = st === "waking" || st === "turning_off";
  let text = LABEL[st] || st;
  if (s.then) text += ` (then ${s.then})`;
  $("stateText").innerHTML = `TV <b>${text}</b>`;
  $("dot").className = "dot " + (st === "on" ? "on" : busy ? "busy" : "");
  $("power").classList.toggle("on", st === "on");
  $("powerText").textContent = st === "on" || st === "waking" ? "Turn off" : "Turn on";
  $("power").setAttribute("aria-label", st === "on" || st === "waking" ? "Switch the TV off" : "Switch the TV on");
  $("root").classList.toggle("off", st === "off" || st === "turning_off");
  showVol(s);
  if (!appsLoaded) loadApps();  // the daemon keeps the list while the TV is off
  schedule(busy ? 1000 : 4000);
}

// ---- apps: the TV's own list (names as the TV gives them), in its order ----
let appsLoaded = false, appsLoading = false;
async function loadApps() {
  if (appsLoading) return;
  appsLoading = true;
  try {
    const r = await rpc("apps");
    const list = r.apps || [];
    if (list.length) {
      appsLoaded = true;
      $("apps").replaceChildren(...list.map(a => {
        const b = document.createElement("button");
        b.className = "k";
        b.title = a.name;
        const t = document.createElement("span");
        t.textContent = a.name;
        b.append(t);
        b.addEventListener("click", () => launch(a));
        return b;
      }));
      $("appsBox").hidden = false;
    }
  } catch (e) { /* tried again on the next status while the TV is on */ }
  appsLoading = false;
}
async function launch(a) {
  if (navigator.vibrate) navigator.vibrate(10);
  try {
    const r = await rpc("launch", {app: a.id});
    say(r.queued ? `Switching the TV on; ${a.name} will open when it's ready` : `Opening ${a.name}…`, true);
    if (tv && r.state !== tv.state) refresh();
  } catch (e) { say(e.code === 9 ? "The TV is switching off" : e.message); }
}
$("appsBox").open = localStorage.getItem("tvremote.appsOpen") !== "0";
$("appsBox").addEventListener("toggle", () => localStorage.setItem("tvremote.appsOpen", $("appsBox").open ? "1" : "0"));

// ---- volume: shown while the TV is on and reports it (UPnP) ----
let volTouched = 0, volWanted = null, volBusy = false, volTimer = null;
function volLabel(v, mute) { return mute ? `Muted (${v})` : String(v); }
function showVol(s) {
  const box = $("volBox");
  box.hidden = s.state !== "on" || s.volume == null;
  if (box.hidden || volBusy || Date.now() - volTouched < 2500) return;  // don't fight a dragging finger
  $("vol").value = s.volume;
  $("volVal").textContent = volLabel(s.volume, s.mute);
  box.classList.toggle("muted", !!s.mute);
}
// One request at a time, then the latest value: a drag sends a few, not hundreds.
async function sendVol() {
  volTimer = null;
  if (volBusy || volWanted === null) return;
  const v = volWanted;
  volWanted = null;
  volBusy = true;
  try { await rpc("set_volume", {volume: v}); }
  catch (e) { say(e.code === 9 ? "The TV is off" : "Volume: " + e.message); }
  volBusy = false;
  if (volWanted !== null) volTimer = setTimeout(sendVol, 120);
}
function volInput() {
  volTouched = Date.now();
  volWanted = +$("vol").value;
  $("volVal").textContent = volWanted;
  if (!volTimer) sendVol();
}
$("vol").addEventListener("input", volInput);
$("vol").addEventListener("change", volInput);

async function refresh() {
  try { show(await rpc("status")); }
  catch (e) {
    $("stateText").textContent = e.message;
    $("dot").className = "dot err";
    schedule(8000);
  }
}
function schedule(ms) {
  clearTimeout(pollTimer);
  if (!document.hidden) pollTimer = setTimeout(refresh, ms);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); else clearTimeout(pollTimer); });

async function key(k) {
  if (navigator.vibrate) navigator.vibrate(8);
  try {
    const r = await rpc("key", {key: k});
    if (r.queued) say("The TV is switching on; the key will be sent when it's ready");
    if (tv && r.state !== tv.state) refresh();
    else if (/^KEY_(VOLUP|VOLDOWN|MUTE)$/.test(k)) schedule(700);  // show the new volume
  } catch (e) { say(e.message); if (e.code === 9) refresh(); }
}

async function power() {
  if (navigator.vibrate) navigator.vibrate(15);
  const on = tv && (tv.state === "on" || tv.state === "waking");
  try { show(await rpc(on ? "power_off" : "power_on")); say(""); }
  catch (e) { say(e.message); }
}

// Buttons: click once; the arrows, volume and channel keys repeat while held.
function bind(btn) {
  const k = btn.dataset.key;
  let delay = null, rep = null;
  const stop = () => { clearTimeout(delay); clearInterval(rep); delay = rep = null; btn.classList.remove("down"); };
  btn.addEventListener("pointerdown", e => {
    if (e.button) return;
    e.preventDefault();
    btn.classList.add("down");
    key(k);
    if ("repeat" in btn.dataset) delay = setTimeout(() => { rep = setInterval(() => key(k), 180); }, 450);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener("click", e => { if (e.detail === 0) key(k); });  // keyboard activation
  btn.addEventListener("contextmenu", e => e.preventDefault());
}

for (let i = 1; i <= 10; i++) {
  const b = document.createElement("button");
  b.className = "k";
  b.dataset.key = "KEY_" + (i % 10);
  b.textContent = i % 10;
  if (i === 10) b.style.gridColumn = "2";
  $("digits").append(b);
}
document.querySelectorAll("[data-key]").forEach(bind);
$("power").addEventListener("click", power);

const KEYS = {ArrowUp: "KEY_UP", ArrowDown: "KEY_DOWN", ArrowLeft: "KEY_LEFT", ArrowRight: "KEY_RIGHT",
  Enter: "KEY_ENTER", Backspace: "KEY_RETURN", Escape: "KEY_EXIT", h: "KEY_HOME", m: "KEY_MUTE",
  "+": "KEY_VOLUP", "=": "KEY_VOLUP", "-": "KEY_VOLDOWN"};
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === "INPUT") return;
  if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON") return;
  const k = KEYS[e.key] || (/^[0-9]$/.test(e.key) ? "KEY_" + e.key : null);
  if (!k) return;
  e.preventDefault();
  key(k);
});

refresh();
</script>
</body>
</html>
